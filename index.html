<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Muhammad Digital Solution - 3D Menu</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Google Model Viewer Sahi Script Path Link -->
    <script type="module" src="https://googleapis.com"></script>
    
    <style>
      body { margin: 0; padding: 0; background-color: #ffffff; font-family: sans-serif; }
      model-viewer { width: 100vw; height: 100vh; background-color: #ffffff; }
      
      #splash-container {
        position: absolute; width: 100vw; height: 100vh; top: 0; left: 0;
        background-color: #ffffff; display: flex; flex-direction: column;
        justify-content: center; align-items: center; z-index: 999;
        transition: opacity 0.5s ease;
      }
      #splash-container img { width: 200px; height: auto; margin-bottom: 20px; }
      #splash-container h1 { font-size: 22px; color: #111111; font-weight: bold; }
    </style>
  </head>
  <body>

    <div id="splash-container">
      <img src="MUHAMMAD ds logo.png" alt="Muhammad Digital Solution">
      <h1>Muhammad Digital Solution</h1>
    </div>

    <model-viewer 
      src="d5e3015e-93f5-4c51-9104-a01a14576000_76da0872bd5fb99710ab8ed634260d88.glb"
      ar
      ar-modes="quick-look webxr scene-viewer"
      ar-scale="auto"
      camera-controls
      touch-action="none"
      auto-rotate>
    </model-viewer>

    <script>
      const splash = document.getElementById('splash-container');
      
      // Automatic Timer: 3 seconds baad logo khud hat jayega aur burger samne aa jayega
      setTimeout(() => {
        splash.style.opacity = 0;
        setTimeout(() => {
          splash.remove();
        }, 500);
      }, 3000); 
    </script>
  </body>
</html>
